syntax = "proto3";

package quickfile.pluginapi.v1;

import "common.proto";

option java_multiple_files = true;

enum OperationKind {
  OPERATION_KIND_UNSPECIFIED = 0;
  OPERATION_KIND_COPY = 1;
  OPERATION_KIND_MOVE = 2;
  OPERATION_KIND_DELETE = 3;
  OPERATION_KIND_RENAME = 4;
  OPERATION_KIND_ARCHIVE = 5;
}

message StartOperationRequest {
  // Job identifier for correlating updates across systems.
  //
  // Contract:
  // - The initiating side MUST provide a value that is unique at least within the current session.
  // - The host MUST echo this id back in every JobUpdate.job_id for this operation.
  JobId job_id = 1;
  OperationKind kind = 2;
  repeated LocationRef sources = 3;
  LocationRef target = 4;
  // Operation-specific options (compression level, overwrite policy hints, etc.).
  bytes options_json = 5;
}

message JobProgress {
  int64 done_units = 1;
  int64 total_units = 2;
  string phase = 3;
  string current_item_name = 4;
}

message JobLogLine {
  string line = 1;
  enum Level {
    LEVEL_UNSPECIFIED = 0;
    LEVEL_INFO = 1;
    LEVEL_WARN = 2;
    LEVEL_ERROR = 3;
  }
  Level level = 2;
}

message JobStatusChanged {
  enum Status {
    STATUS_UNSPECIFIED = 0;
    STATUS_QUEUED = 1;
    STATUS_RUNNING = 2;
    STATUS_PAUSED = 3;
    // Terminal status: the operation finished successfully.
    STATUS_COMPLETED = 4;
    // Terminal status: the operation finished with an error.
    STATUS_FAILED = 5;
    // Terminal status: the operation was cancelled (e.g. by user request).
    // Cancellation is always final; after this status no further updates will be emitted.
    STATUS_CANCELLED = 6;
  }
  // Current job status. Terminal statuses are: COMPLETED, FAILED, CANCELLED.
  Status status = 1;
  // Optional human-readable message (best-effort). Not intended for programmatic parsing.
  string message = 2;
}

message JobUpdate {
  JobId job_id = 1;
  oneof body {
    JobProgress progress = 2;
    JobLogLine log = 3;
    JobStatusChanged status = 4;
  }
}

message CancelOperationRequest {
  JobId job_id = 1;
}

message CancelOperationResponse {
  // True if the host accepted the cancellation request for processing.
  //
  // Contract:
  // - accepted=true means the host will attempt to cancel the job.
  // - If the job is still active, the job's StartOperation stream will eventually emit
  //   JobStatusChanged with status=CANCELLED and then end normally.
  // - accepted=false means the cancellation request could not be applied (e.g. unknown job id,
  //   job already terminal, or job is not cancellable).
  bool accepted = 1;
}

service FileOperations {
  // Starts a long-running operation and returns a stream of updates.
  //
  // Stream contract:
  // - The stream may emit progress/log/status updates in any order.
  // - Exactly one terminal status MUST be emitted: COMPLETED, FAILED, or CANCELLED.
  // - After the terminal status is emitted, the server MUST close the stream normally.
  rpc StartOperation(StartOperationRequest) returns (stream JobUpdate);
  rpc CancelOperation(CancelOperationRequest) returns (CancelOperationResponse);
}
